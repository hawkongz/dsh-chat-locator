# ============================================================================
# dsh-chat-locator 的 bundle patch —— 把对话定位条插件挂进 DSH 配置树
# ============================================================================
#
#   - insert：往配置树里添加一条新的插件行（entry）
#   - id：行标识，patch 覆盖时按它定位
#   - name：模块名，解析到本包入口 index.js（宿主半侧）
#   - 因为 package.json 声明了 dsh.bundle.patch 与 dsh.client，
#     DSH 会同时把这个包扫描为浏览器插件，把 ./client 半侧发给页面。
#
# ============================================================================

- insert:
    - id: chat-locator
      name: 'dsh-chat-locator'
